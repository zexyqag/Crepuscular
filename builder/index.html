<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Crepuscular builder</title>
<link rel="icon" href="data:,">
<style>
:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --fg: #1c2230;
    --muted: #586071;
    --border: #d3d8e0;
    --field: #ffffff;
    --accent: #3f43a8;
    --accent-fg: #ffffff;
    --error: #a8231b;
    --error-bg: #fdebea;
    --warn: #7a4f00;
    --warn-bg: #fff3d4;
    --ok: #1d6b3a;
    --day: #fff8e6;
    --night: #e9ecf8;
    --focus: #1a5fd0;
    --chip-border: rgba(0, 0, 0, 0.25);
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #111318;
        --card: #1a1d24;
        --fg: #e5e7ec;
        --muted: #a4abb8;
        --border: #363c49;
        --field: #12151b;
        --accent: #a7abff;
        --accent-fg: #14152e;
        --error: #ff9b93;
        --error-bg: #3b1c1a;
        --warn: #ffd27a;
        --warn-bg: #352b12;
        --ok: #8fd9a8;
        --day: #2a2617;
        --night: #1c2236;
        --focus: #8ab4ff;
        --chip-border: rgba(255, 255, 255, 0.3);
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
    overflow-wrap: anywhere;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
header { padding: 20px 0 8px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.2rem; margin: 0 0 8px; }
h3 { font-size: 1.05rem; margin: 16px 0 6px; }
p { margin: 6px 0; }
.muted, .help { color: var(--muted); }
.help { font-size: 0.9rem; margin: 2px 0 0; }
a { color: var(--accent); }
code, textarea, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.9rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

[role="tablist"] {
    display: flex; flex-wrap: wrap; gap: 4px;
    border-bottom: 1px solid var(--border); margin: 8px 0 16px;
    position: sticky; top: 0; background: var(--bg); z-index: 2; padding-top: 4px;
}
[role="tab"] {
    border: 1px solid transparent; border-bottom: none; background: none; color: var(--fg);
    padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 6px 6px 0 0; margin-bottom: -1px;
}
[role="tab"][aria-selected="true"] { background: var(--card); border-color: var(--border); font-weight: 600; }
.badge {
    display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; font-size: 0.8rem;
    text-align: center; line-height: 1.5; vertical-align: 1px; margin-left: 4px;
}
.badge.error { background: var(--error-bg); color: var(--error); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }

.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin: 0 0 16px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; margin-top: 8px; }
.row > * { min-width: 0; }
label, .label { display: block; font-weight: 600; font-size: 0.95rem; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
    font: inherit; color: var(--fg); background: var(--field);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; max-width: 100%;
}
textarea { width: 100%; min-height: 4.5em; resize: vertical; line-height: 1.35; }
textarea.big { min-height: 7em; }
input.small { width: 6.5em; }
input.tiny { width: 4.5em; }
input.wide, select.wide { width: 100%; }
button {
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 12px 0 0; padding: 8px 12px 12px; min-width: 0; }
legend { font-weight: 700; padding: 0 4px; }
.field { margin: 10px 0 0; }
.field:first-of-type { margin-top: 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 0; padding: 0; border: none; }
.checks label, .inline { display: inline-flex; align-items: center; gap: 4px; font-weight: 400; }
.choice { display: flex; flex-wrap: wrap; gap: 4px 14px; }

.msg { margin: 4px 0 0; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem; }
.msg.error { background: var(--error-bg); color: var(--error); }
.msg.warn { background: var(--warn-bg); color: var(--warn); }
.msg.info { background: var(--night); color: var(--fg); }
ul.msgs { list-style: none; padding: 0; margin: 4px 0; }

.meter { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin: 4px 0; }
.meter .bar { flex: 1 1 80px; max-width: 220px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--ok); }
.meter.amber .fill { background: #d99a00; }
.meter.red .fill { background: var(--error); }
.meter.amber .num { color: var(--warn); }
.meter.red .num { color: var(--error); font-weight: 700; }

details.event { border: 1px solid var(--border); border-radius: 6px; margin: 8px 0; background: var(--card); }
details.event > summary {
    padding: 8px 10px; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
details.event > .body { padding: 0 12px 12px; border-top: 1px solid var(--border); }
details.tip > summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
details.tip p { font-size: 0.9rem; color: var(--muted); }
.chip {
    display: inline-block; max-width: 100%; padding: 0 6px; border-radius: 4px; border: 1px solid var(--chip-border);
    font-size: 0.85rem; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.swatch { display: inline-block; width: 0.9em; height: 0.9em; border-radius: 3px; border: 1px solid var(--chip-border); vertical-align: -1px; }
.setrow { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) auto; gap: 6px; margin: 6px 0 0; align-items: center; }
.setrow input { width: 100%; }
.kindrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 6px; margin: 6px 0 0; align-items: center; }
.kindrow input { width: 100%; }
.monster { margin: 8px 0 0; }
.monster p { margin: 2px 0; }
pre.out { white-space: pre-wrap; word-break: break-all; background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 6px 0; max-height: 26em; overflow: auto; }
.preset ul { margin: 4px 0; padding-left: 1.2em; font-size: 0.9rem; }
.preset .notes { color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 8px 0; font-size: 0.9rem; }
.month { margin: 18px 0; }
.month h3 { margin: 0 0 6px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow { font-size: 0.75rem; color: var(--muted); text-align: center; }
.cell {
    display: block; width: 100%; min-height: 4.2em; padding: 2px 3px 3px; text-align: left; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card); font-size: 0.75rem; line-height: 1.25; overflow: hidden;
}
.cell[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 0; }
.cell { overflow-wrap: normal; }
.cell .top { display: flex; justify-content: space-between; gap: 2px; white-space: nowrap; overflow: hidden; }
.cell .date { font-weight: 700; }
.cell .moonname { color: var(--muted); font-size: 0.7rem; }
.cell .moonname.first { color: var(--fg); font-weight: 700; }
.occ { display: block; margin-top: 2px; padding: 0 2px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.occ.day { background: var(--day); }
.occ.night { background: var(--night); }
.occ .chip { font-size: 0.7rem; padding: 0 3px; }
.occ .cont { opacity: 0.8; font-style: italic; }
.blank { visibility: hidden; }
.detail { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 8px 0 0; background: var(--card); }
.detail h4 { margin: 10px 0 4px; font-size: 1rem; }
.log { font-size: 0.85rem; margin: 4px 0; padding-left: 1.2em; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.scroll { overflow-x: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
    .cell { min-height: 3.6em; font-size: 0.68rem; padding: 1px 2px 2px; }
    .occ .chip { font-size: 0.64rem; padding: 0 2px; }
    .cell .moonname { font-size: 0.58rem; }
    .setrow, .kindrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .setrow button, .kindrow button { grid-column: span 2; justify-self: start; }
    [role="tab"] { padding: 8px 10px; }
}
</style>
</head>

<script>
(function () {
    "use strict";
    var C = window.Crepuscular;
    var P = window.CrepuscularPresets;
    var Defs = C.Defs, Text = C.Text;
    var STORE = "crepuscular-builder";

    // ---------------------------------------------------------------- in-game texts (EN translations)
    var EVENTS_MORE = "More events, written as in Events 1. The option an event is in only matters between events with the same prio: earlier ones are tried first.";
    var TEXT = {
        NightMode: { name: "Night mode", options: ["Fixed hours", "Seasonal night"], tooltip: "How night is decided. Fixed hours: night runs between the two hours below, every day of the year, whatever the Day/Night Cycle setting. Seasonal night: the game's own dusk and dawn, which move with the seasons and follow the Day/Night Cycle setting (endless day has no night, endless night is always night)." },
        NightStartHour: { name: "Night starts at", tooltip: "Hour of the day, 0 to 23, at which night begins when Night mode is Fixed hours. Night can run past midnight. If both hours are the same there is no night at all, and the log says so." },
        NightEndHour: { name: "Night ends at", tooltip: "Hour of the day, 0 to 23, at which night ends when Night mode is Fixed hours." },
        Day: { name: "Day", tooltip: "What changes by day while no event runs. Fields are key=value, separated by ;. speed=+25 makes 25 percent of ordinary zombies one tier faster (shambler to fast shambler, fast shambler to sprinter) and speed=-50 makes 50 percent one tier slower; a zombie that speeds up is among the last to slow down, and speed=0 keeps every zombie at the game's speed. steps=2 moves them two tiers: always sprinters or always shamblers. health=0.7 gives new and reloaded zombies 70 percent of the health they roll and lowers any zombie above 70 percent of the most a new one can have; health=1.5 gives new and reloaded zombies 150 percent, and zombies already around keep theirs. rise=50 marks 50 percent of the zombies killed while the day lasts to get up again (rise=100 all of them, rise=0 none), and wake=true lets marked corpses get up while it lasts; a corpse marked by day without wake=true gets up once a definition with it applies, such as the default Night. When and how often they rise is set by the options below. speed, health, rise and the sky numbers can grow with the days since the world began: speed=+25..+75;grow=60d goes from +25 on world day 0 to +75 on world day 60 and stays there, grow=30d..90d moves it between those days instead, and health=0.7..0.4, rise=25..100 and fog=0.2..0.6 work the same way. World days are counted at noon, as for every= and mindays=, and a speed or rise share is rounded to a whole percent. A range needs grow= in the same definition, and grow= moves only that definition's own ranges. Monsters of every kind, Bandits and crawlers keep their own speed and are never capped; the health factor is given as the game creates a zombie, before it marks some of them, so a reloaded crawler or a new mutant may get it too. off=cof,mutants turns those monster kinds off (off=none turns none off): far ones are removed, The Mutants makes no new mutants and Cry of Fear Monster NPCs spawns nothing new; a Zomboid Forge kind such as tlou_clicker only loses its far members. A kind no definition turns off is left alone. For Cry of Fear monsters only at night, write off=cof here and keep its own Night only option off; as with that option, each time cof is on again every Cry of Fear home may be filled again, so killed monsters come back too. set.Table.Option=value changes a sandbox option, for example set.ZombieLore.Toughness=1, or set.Option=value for an option without a table, for example set.HoursForCorpseRemoval=24; it goes back to its base value when the day ends. say=text shows a line to every player when the day begins (say=@Key shows that translation), and color=rrggbb gives its colour. sound=Name plays that game sound on every player's game at the same moment, with or without a line, for example sound=MetaWolfHowl; upper and lower case matter. A player who joins or loads the game while the day lasts gets the line and the sound then. sky=rrggbbaa tints the light while the day lasts, aa being the strength from 00 (none) to ff (full), for example sky=ff964660. fogcolor=rrggbb colours fog, and fog=, desat= (grey), dark= (night strength) and ambient= (ambient light) set those values from 0 to 1. Each replaces the game's own value while it applies and gives it back afterwards, and one not set stays the game's. fog= works like the game's own fog: as natural fog does, it also shortens how far zombies see and hear and lowers ranged hit chance, but it sets only how thick the fog is, not the grey light natural fog brings with the weather. fogcolor= shows only with the improved fog, not with the legacy fog quality option. The game fades desat= out with the daylight, so it hardly shows in the middle of the night. dark= brings out the stars, street lights and night sounds but doesn't darken a day; ambient= and sky= do. In single player a darker sky or ambient also makes players harder for zombies to spot, as the game's own darkness does; a dedicated server doesn't model light for zombie sight. The server sets them: in multiplayer players see a change within about an in-game minute, faded in over about 5 seconds, and players who join see it at once. Admin climate overrides win, rain and storms still mix in their own sky and fog, and view distance can't be set directly; fog= shortens it as natural fog does. A sun event starts from these values, except say=, color= and sound=. The default, speed=+25;health=0.7, makes a quarter of the zombies faster and the zombies more fragile, zombies killed by day stay down, and the sky is the game's. A bad field is skipped and logged, and the rest applies." },
        Night: { name: "Night", tooltip: "What changes by night while no event runs, written as for Day: speed=-50 or speed=+25, steps=2, health=1.5, rise=50, wake=true, a range that grows such as speed=-25..-75;grow=60d, off=mutants,cof or off=none, set.Table.Option=value, say=text, color=rrggbb, sound=Name, and the sky: sky=rrggbbaa, fogcolor=rrggbb and fog=, desat=, dark= and ambient= from 0 to 1, which reach players' games within about an in-game minute. fog= works like natural fog, so zombies and players also see less far, zombies hear less and shots miss more, and desat= hardly shows in the middle of the night. The values go back to their base when the night ends. A moon event starts from these values except say=, color= and sound=, even when it runs into the day. The default, speed=-50;rise=50;wake=true;off=mutants, makes half of the zombies slower, marks half of the zombies killed at night to get up again and lets marked corpses get up at night, keeps The Mutants from making mutants at night and removes far mutants; the sky is the game's." },
        Events1: { name: "Events 1", tooltip: "Moons and suns: special nights and days. Events are separated by |, fields by ;. Each event needs id=name (letters a-z, digits and _) and track=moon (decided when night begins) or track=sun (decided when day begins). Conditions, which must all hold: moon=full (the first night of a full moon; also new, waxingcrescent, firstquarter, waxinggibbous, waninggibbous, thirdquarter, waningcrescent), date=10-31 or date=12-20..01-05, month=6..8, season=summer, every=30 (every 30 days since the world began; every=30+5 shifts it by 5), mindays=30 and maxdays=365 (days since the world began), nth=4 (every 4th time its calendar conditions hold), after=id (the first time after that event ended), cooldown=20d or 36h, interval=3d..7d (after each start it waits a random 3 to 7 whole days, counted in world days, before it can happen again, and the first wait counts from world day 0, the day mindays= and every= count from, or for hours from 07:00 that day; interval=7d waits exactly 7 days, interval=12h..36h whole hours from its start time, but hours drift against a seasonal dusk or dawn, so days suit a nightly or daily rhythm; once the wait is over it stays a candidate until it starts, so a lost chance or a higher prio doesn't roll a new wait, and an admin start counts as a start), weather=rain, snow, storm, fog (as players see it, so the fog= in effect counts) or clear, tempmin=0 and tempmax=30 (degrees C), chance=50. A list such as moon=full,new holds when any item does. Timing: at=HH:MM starts it later in its night or day, and for=phase (the default), 2p (phases), 6h or 3.5d sets how long it lasts. prio=10: when several events qualify, the highest is tried first. Effects: speed, steps, health, rise, wake, off, set., say, color, sound and the sky (sky, fogcolor, fog, desat, dark, ambient), as in Day and Night, with grow= for its own ranges; a moon starts from Night and a sun from Day except for say, color and sound, and a range it takes from them grows with their grow=. Players' games get its sky within about an in-game minute of its start, and admin climate overrides win; its fog= works like natural fog, so zombies and players also see less far, zombies hear less and shots miss more. One event runs at a time, and nothing else is decided while it runs. An event with an error is skipped and logged. Keep each option under 32000 bytes." },
        Kinds: { name: "Monster kinds", tooltip: "Monsters of other mods, told by their outfit: name=prefix,prefix;name=prefix, for example wraiths=ZW_,Wraith;husks=Husk_. A zombie whose outfit name starts with one of the prefixes (upper and lower case don't matter) belongs to that kind. Names are made of a-z, 0-9 and _. Every special-zombie mod needs a kind, even one never turned off: without it Crepuscular treats its monsters as ordinary zombies and changes their speed and health. cof (Cry of Fear Monster NPCs) and mutants (The Mutants) are built in, and so is a kind for each Zomboid Forge type, its id lowercased with only a-z, 0-9 and _ kept: tlou_clicker for The Last of Us Infected's clickers. Other mods can add kinds of their own. Put a kind in off= of Day, Night or an event to remove its far members while that applies; it can't keep a mod from turning zombies into its monsters. When The Mutants is loaded, members of every kind are never turned into mutants." },
    };
    Defs.SLOTS.slice(1).forEach(function (slot) {
        TEXT[slot] = { name: "Events " + slot.slice(6), tooltip: EVENTS_MORE };
    });
    var SAY_KEYS = { "@IGUI_Crepuscular_BloodMoon": "The moon rises red. A blood moon has begun." };

    var MOON_LABELS = ["new", "waxing crescent", "first quarter", "waxing gibbous", "full", "waning gibbous", "third quarter", "waning crescent"];
    var SEASON_NAMES = ["spring", "summer", "autumn", "winter"];
    var SEASON_NUMBERS = { spring: [1], summer: [2, 3], autumn: [4], winter: [5] };

    // The game's own night light, ClimateManager's colNight: 0.33 grey at 0.4.

    // Sounds the game itself plays by name, all of them once rather than in a loop.
    var SOUNDS = [
        ["Thunder", "a thunder clap"], ["RumbleThunder", "far thunder rolling"], ["MetaWolfHowl", "a wolf howling far away"],
        ["MetaOwl", "an owl"], ["MetaScream", "a scream far away"], ["MetaDogBark", "a dog barking far away"],
        ["WorldEventElectricityShutdown", "the power grid shutting down"],
    ];

    var HELP = {
        id: "Required. Letters a-z, digits and _, unique across all Events options. Counters and chains are kept by id.",
        track: "Required. moon: decided when night begins. sun: decided when day begins.",
        at: "HH or HH:MM: starts it later in its night or day. With fixed hours it must fall inside the night (moon) or the day (sun).",

    // The fields with the preset's in place of the zombie keys and the keys it lists, each where KEY_ORDER puts it.
    function withPreset(fields, preset) {
        var add = Text.fields(preset.effects);
        // Keyed by field names, which may be "constructor" or "__proto__".
        var replaced = Object.create(null);
        P.ZOMBIE_KEYS.concat(add.map(fieldKey)).forEach(function (k) { replaced[k] = true; });
        var out = fields.filter(function (f) { var k = fieldKey(f); return k === null || replaced[k] !== true; });
        add.forEach(function (f) { place(out, f.name, f.value); });
        return { fields: out, replaced: replaced };
    }

    // Each replaced key as it was and as it is now, in the order of the new text; those that stayed the same; the
    // fields left alone, by name.
    function changes(before, after, replaced) {
        var old = Object.create(null);
        before.forEach(function (f) {
            var k = fieldKey(f);
            if (k !== null && replaced[k]) { (old[k] = old[k] || []).push(fieldText(f)); }
        });
        var lines = [], same = [], seen = Object.create(null);
        after.forEach(function (f) {
            var k = fieldKey(f);
            if (k === null || !replaced[k]) { return; }
            seen[k] = true;
            var was = old[k] ? old[k].join("; ") : null;
            if (was === fieldText(f)) { same.push(was); }
            else if (was === null) { lines.push({ what: "added", text: fieldText(f) }); }
            else { lines.push({ from: was, text: fieldText(f) }); }
        });
        Object.keys(old).forEach(function (k) { if (!seen[k]) { lines.push({ what: "removed", text: old[k].join("; ") }); } });
        var kept = before.filter(function (f) { var k = fieldKey(f); return k === null || !replaced[k]; })
            .map(function (f) { return f.eq ? f.name : fieldText(f); });
        return { lines: lines, same: same, kept: kept };
    }

    function snapshot() {

    function applyPreset(owner, preset) {

            var f = Text.fields(t);
            var id = getField(f, "id");
            var free = freeId(id, list);
            if (free !== id) {
                renamed[id] = free;
                setField(f, "id", free);
                notes.push(id + " is taken, so it is " + free);
            }
            list.push({ slot: slot, text: Text.join(f) });
            return f;
        });
        added.forEach(function (f, i) {
            var after = getField(f, "after");
            if (after === null) { return; }
            var items = after.split(",").map(function (x) { return x.trim(); });
            if (items.some(function (x) { return renamed[x] !== undefined; })) {
                var now = items.map(function (x) { return renamed[x] || x; }).join(",");
                setField(f, "after", now);

        setEvents(list);
        state.open = {};
        state.offList = {};

            } else {
                state.values[state.importTarget] = cleaned;
                state.importReport = { summary: "Set " + TEXT[state.importTarget].name + ".", problems: [] };
            }
        } else {
            var r = kind === "lua" ? C.Import.lua(text) : C.Import.env(text);

            }
            set.forEach(function (name) { state.values[name] = C.Output.clean(name, r.values[name]); });
            var ignored = r.ignored.filter(function (x, i, a) { return a.indexOf(x) === i; });

                    + (ignored.length ? " Left out: " + ignored.join(", ") + "." : ""),
                problems: r.problems,
            };
        }
        state.open = {};
        state.offList = {};
        state.stats = null;
    }

    // ---------------------------------------------------------------- calendar
    function parseDate(text) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
        if (!m) { return null; }
        var d = { year: Number(m[1]), month: Number(m[2]) - 1, day: Number(m[3]) };
        if (d.month < 0 || d.month > 11 || d.day < 1 || d.day > C.Phase.daysInMonth(d.year, d.month)) { return null; }
        return d;
    }

    function parseTime(text) {
        var m = /^(\d{1,2}):(\d{2})/.exec(text || "");
        if (!m || Number(m[1]) > 23 || Number(m[2]) > 59) { return null; }
        return Number(m[1]) * 60 + Number(m[2]);
    }

    function hhmm(minute) {
        var hh = Math.floor(minute / 60), mm = minute % 60;
        return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
    }

    var SEASON_OF_MONTH = [5, 5, 1, 1, 1, 2, 2, 2, 4, 4, 4, 5];

    function simRule(cal) {
        var v = state.values;
        if (v.NightMode === 1) { return { mode: 1, start: v.NightStartHour, finish: v.NightEndHour }; }
        return { mode: 2, dawn: parseTime(cal.dawn) / 60, dusk: parseTime(cal.dusk) / 60, endless: cal.cycle === "normal" ? undefined : cal.cycle };
    }

    function calInputs() {
        var cal = state.cal;
        var start = parseDate(cal.start), time = parseTime(cal.time);
        var problems = [];
        if (!start) { problems.push("The world start date isn't a date."); }
        if (time === null) { problems.push("The world start time isn't a time."); }
        if (state.values.NightMode === 2 && cal.cycle === "normal") {
            var dawn = parseTime(cal.dawn), dusk = parseTime(cal.dusk);
            if (dawn === null || dusk === null || dawn >= dusk) { problems.push("Dawn must come before dusk."); }
        }
        var from = /^(\d{4})-(\d{2})$/.exec(cal.from || "");
        var first = from ? { year: Number(from[1]), month: Number(from[2]) - 1 } : start ? { year: start.year, month: start.month } : null;
        if (first && start && (first.year < start.year || (first.year === start.year && first.month < start.month))) {
            first = { year: start.year, month: start.month };
        }
        var months = Math.max(1, Math.min(36, Math.floor(Number(cal.months)) || 6));
        ["seed", "rain", "snow", "storm", "fog", "winter", "summer"].forEach(function (k) {
            if (String(cal[k]).trim() === "" || !isFinite(Number(cal[k]))) { problems.push("The " + k + " field isn't a number."); }
        });
        return { start: start, time: time, first: first, months: months, problems: problems };
    }

    function climateFor(cal, rnd) {
        function chance(p) { return rnd() * 100 < Number(p); }
        return function (now) {
            var rain = chance(cal.rain), snow = chance(cal.snow), storm = chance(cal.storm);
            var fogDraw = rnd(), fogLevel = rnd();
            var noise = rnd();
            var doy = C.Sim.daysBetween({ year: now.year, month: 0, day: 1 }, now);
            var mid = (Number(cal.winter) + Number(cal.summer)) / 2, amp = (Number(cal.summer) - Number(cal.winter)) / 2;
            var temp = mid - amp * Math.cos(2 * Math.PI * (doy - 15) / 365.25) + (noise * 2 - 1) * 6;
            return {
                rain: rain, snow: snow, storm: storm,
                fog: fogDraw * 100 < Number(cal.fog) ? 0.5 + fogLevel * 0.5 : fogLevel * 0.5,
                temp: temp, season: SEASON_OF_MONTH[now.month],
            };
        };
    }

    function simulate(chk, inp, minutes, record) {
        var rnd = C.Sim.random(Math.floor(Number(state.cal.seed)) || 0);
        return C.Sim.run({
            defs: chk.defs, rule: simRule(state.cal),
            start: { year: inp.start.year, month: inp.start.month, day: inp.start.day, minute: inp.time },
            minutes: minutes, record: record,
            roll: function () { return rnd() * 100; },
            climate: climateFor(state.cal, rnd),
        });
    }

    var simCache = { key: null, result: null };
    function calendarRun(chk, inp) {
        var last = { year: inp.first.year + Math.floor((inp.first.month + inp.months - 1) / 12), month: (inp.first.month + inp.months - 1) % 12 };
        var end = { year: last.year, month: last.month, day: C.Phase.daysInMonth(last.year, last.month) };
        var minutes = (C.Sim.daysBetween(inp.start, end) + 2) * 1440 - inp.time;
        var key = JSON.stringify([state.values, state.registered, state.cal.start, state.cal.time, state.cal.dawn, state.cal.dusk,
            state.cal.cycle, state.cal.seed, state.cal.rain, state.cal.snow, state.cal.storm, state.cal.fog, state.cal.winter, state.cal.summer, minutes]);
        if (simCache.key !== key) {
            simCache = { key: key, result: simulate(chk, inp, minutes, true) };
        }
        return simCache.result;
    }

    // Runs never overlap and both lists are in time order.
    function indexRun(result) {
        var byDate = {};
        var runs = result.runs, j = 0;
        result.occasions.forEach(function (r, i) {
            var end = r.end === null ? Infinity : r.end;
            while (j < runs.length && runs[j].endedAt !== null && runs[j].endedAt <= r.start) { j++; }
            r.events = [];
            for (var k = j; k < runs.length && runs[k].startsAt < end; k++) {
                if ((runs[k].endedAt === null ? Infinity : runs[k].endedAt) > r.start) { r.events.push(runs[k]); }
            }
            r.index = i;
            (byDate[r.key] = byDate[r.key] || []).push(r);
        });
        Object.keys(byDate).forEach(function (k) { byDate[k].sort(function (a, b) { return a.start - b.start; }); });
        return byDate;
    }

    function stamp(clock, hours) {
        var m = clock.moment(hours);
        return C.Phase.key(m) + " " + hhmm(m.minute);
    }

    // HH:MM on the given date, MM-DD HH:MM on another.
    function shortStamp(clock, hours, key) {
        var m = clock.moment(hours);
        return (C.Phase.key(m) === key ? "" : C.Phase.key(m).slice(5) + " ") + hhmm(m.minute);
    }

    function colorOf(chk, id) {
        var ev = chk.defs.byId[id];
        return ev ? ev.color : undefined;
    }

    function occLine(chk, r, mode) {
        var cls = "occ " + r.phase;
        var label = h("span", { "class": "sr" }, r.phase + ": ");
        if (mode === "candidates") {
            var ids = r.pool ? r.pool.ids : [];
            if (!ids.length) { return h("span", { "class": cls }, label, h("span", { "class": "muted" }, r.pool && r.pool.covered ? "…" : "")); }
            return h("span", { "class": cls }, label, ids.map(function (id) {
                var ev = chk.defs.byId[id];
                return h("span", { "class": "chip", style: chipStyle(ev.color) }, id + (ev.chance !== undefined && ev.chance < 100 ? " " + C.luaString(ev.chance) + "%" : ""));
            }));
        }
        if (!r.events.length) { return h("span", { "class": cls }, label, h("span", { "class": "blank" }, "·")); }
        var run = r.events[0];
        var started = run.startsAt >= r.start - 1 / 120;
        return h("span", { "class": cls }, label,
            h("span", { "class": "chip" + (started ? "" : " cont"), style: chipStyle(colorOf(chk, run.id)) }, (started ? "" : "…") + run.id),
            r.events.length > 1 ? " +" + (r.events.length - 1) : null);
    }

    // The date whose noon counts world day n, as in Schedule.worldDay.
    function dateOfDay(inp, n) {
        return C.Phase.key(C.Sim.addDays(inp.start, n - (inp.time <= 420 ? 1 : 0)));
    }

    function waitText(w, clock, inp) {
        var later = w.to > w.from ? ", rolled the next time it could be picked" : "";
        if (w.unit === "d") {
            return w.id + " due from world day " + w.from + " (" + dateOfDay(inp, w.from) + ")"
                + (w.to > w.from ? " to world day " + w.to + " (" + dateOfDay(inp, w.to) + ")" : "") + later;
        }
        return w.id + " due from " + stamp(clock, w.from) + (w.to > w.from ? " to " + stamp(clock, w.to) : "") + later;
    }

    // Whether a zombie value grows.
    function grows(chk) {
        var keys = GROWING.filter(function (k) { return NEUTRAL[k] !== undefined; });
        return [chk.defs.day, chk.defs.night].concat(chk.defs.events).some(function (d) {
            return keys.some(function (k) { return typeof d[k] === "object"; });
        });
    }

    // What is in effect in occasion r at world-age hours, resolved as the mod does on its world day: value(key) is the
    // running event's own or its base's, and where names them.
    function inEffect(chk, r, hours) {
        var run = r.events.filter(function (x) { return x.startsAt <= hours + 1 / 120 && (x.endedAt === null || x.endedAt > hours); })[0];
        var ev = run ? chk.defs.byId[run.id] : undefined;
        var base = (ev ? ev.track === "moon" : r.phase === "night") ? chk.defs.night : chk.defs.day;
        var day = C.Schedule.worldDay(r, hours);
        return {
            value: function (key) { return C.Defs.at(ev !== undefined && ev[key] !== undefined ? ev : base, key, day); },
            where: " (" + (ev ? ev.id : base.label) + ", world day " + day + ")",
        };
    }

    function zombiesAt(chk, r, hours) {
        var at = inEffect(chk, r, hours);
        return ["speed", "steps", "health", "rise", "wake"].map(function (key) {
            var v = at.value(key);

                // turned on at the game's night.
                var skyPart = el.getAttribute("data-part");
                var a = Number(box.querySelector("[data-part=alpha]").value);
                var skyText = skyPart === "hex" ? clean(el).replace(/^#/, "").trim() : skyPart === "on" ? (el.checked ? NIGHT_SKY : "")
                    : box.querySelector("[data-part=picker]").value.slice(1) + (a < 16 ? "0" : "") + a.toString(16);
                editDef(owner, function (f) { setField(f, "sky", skyText.toLowerCase()); });
            } else if (act === "off") {
                var mode = box.querySelector("[data-part=mode]:checked").value;
                var kinds = Array.prototype.filter.call(box.querySelectorAll("[data-part=kind]"), function (c) { return c.checked; }).map(function (c) { return c.value; });
                var other = clean(box.querySelector("[data-part=other]")).split(",").map(function (x) { return x.trim(); }).filter(Boolean);
                var list = kinds.concat(other).join(",");
                state.offList[keyOf(owner)] = mode === "list" && list === "";
                editDef(owner, function (f) { setField(f, "off", mode === "inherit" ? null : mode === "none" ? "none" : list || null); });
            } else if (act === "setname" || act === "setvalue") {
                var fi = Number(el.closest("[data-set]").getAttribute("data-set"));
                var t = clean(el, act === "setname" ? /[;|=\x00-\x1f\x7f]/g : null).trim();
                editDef(owner, function (f) {
                    if (act === "setname") { f[fi].name = "set." + t; } else { f[fi].value = t; }
                });
            } else if (act === "cof") {
                var name = "set.COF_Spawns." + el.getAttribute("data-k");
                editDef(owner, function (f) {
                    var at = f.findIndex(function (x) { return x.eq && x.name.slice(0, 4).toLowerCase() === "set." && "set." + x.name.slice(4) === name; });
                    if (el.value === "") { if (at >= 0) { f.splice(at, 1); } }
                    else if (at >= 0) { f[at].value = el.value; }
                    else { place(f, name, el.value); }
                });
            } else if (act === "other") {
                var oi = Number(el.closest("[data-other]").getAttribute("data-other"));
                var txt = clean(el, /[;|]/g);
                editDef(owner, function (f) { f[oi] = rawField(txt); });
            } else if (act === "evraw") {
                var raw = clean(el, /[|]/g);
                var texts = Text.events(state.values[owner.slot]);
                texts[owner.index] = raw.trim() === "" ? "id=" : raw;
                state.values[owner.slot] = texts.join("|");
            } else if (act === "raw") {
                state.values[el.getAttribute("data-k")] = el.value;
            } else if (act === "kindname" || act === "kindprefix") {
                var ki = Number(el.closest("[data-kind]").getAttribute("data-kind"));
                var kt = clean(el, act === "kindname" ? /[;|=\x00-\x1f\x7f]/g : null).trim();
                var kf = Text.fields(state.values.Kinds);
                if (act === "kindname") { kf[ki] = { name: kt, value: kf[ki].eq ? kf[ki].value : "", eq: true }; } else { kf[ki] = { name: kf[ki].eq ? kf[ki].name : kf[ki].value, value: kt, eq: true }; }
                state.values.Kinds = Text.join(kf);
            } else if (act === "registered") {
                state.registered = clean(el);
            } else if (act === "mod") {
                state.mods[el.value] = el.checked;
            } else if (act === "forge") {
                var fpart = el.getAttribute("data-part");
                if (fpart === "on") { state.forge.on = el.checked; }
                else if (fpart === "type") { state.forge.known[el.value] = el.checked; }
                else { state.forge.other = clean(el); }
            } else if (act === "presetpick" || act === "examplepick") {
                state.picks[keyOf(owner)] = el.value;
            } else if (act === "slot") {
                var evs = eventList();
                var at = evs.findIndex(function (x) { return x.slot === owner.slot && x.index === owner.index; });
                var moved = evs[at];
                moved.slot = el.value;
                setEvents(evs);
                state.open = {};
                state.offList = {};
                var now = eventList().findIndex(function (x) { return x.slot === moved.slot && x.text === moved.text; });
                if (now >= 0) { state.open[moved.slot + ":" + eventList()[now].index] = true; }
            } else if (act === "clock") {
                state.values[el.getAttribute("data-k")] = Number(el.value);
            } else if (act === "cal") {
                var ck = el.getAttribute("data-k");
                state.cal[ck] = el.value;
            } else if (act === "showall") {
                state.showAll = el.checked;
            } else if (act === "importtext") {
                state.importText = el.value;
            } else if (act === "importas") {
                state.importAs = el.value;
            } else if (act === "importtarget") {
                state.importTarget = el.value;
            } else if (act === "importreset") {
                state.importReset = el.checked;
            }
        });
    }

    function freeId(base, list) {
        var taken = {};
        list.forEach(function (e) { var id = getField(Text.fields(e.text), "id"); if (id) { taken[id.toLowerCase()] = true; } });
        if (!taken[base]) { return base; }
        for (var i = 2; ; i++) { if (!taken[base + "_" + i]) { return base + "_" + i; } }
    }

    function onClick(e) {
        var el = e.target.closest("[data-act]");
        if (!el || el.tagName === "INPUT" || el.tagName === "SELECT" || el.tagName === "TEXTAREA") { return; }
        var act = el.getAttribute("data-act");
        var owner = ownerOf(el);
        if (act === "copy") {
            copy(document.getElementById(el.getAttribute("data-k")), el);
            return;
        }
        var focus = null;
        update(function () {
            state.notice = null;
            var list = eventList();
            var g = owner && owner.slot ? list.findIndex(function (x) { return x.slot === owner.slot && x.index === owner.index; }) : -1;
            if (act === "tab") {
                state.tab = el.getAttribute("data-k");
            } else if (act === "evadd") {
                var slot = list.length ? list[list.length - 1].slot : "Events1";
                list.push({ slot: slot, text: "id=" + freeId("event" + (list.length + 1), list) + ";track=moon" });
                setEvents(list);
                state.open = {};
                state.offList = {};
                state.open[slot + ":" + (Text.events(state.values[slot]).length - 1)] = true;
            } else if (act === "pack") {
                var bytes = 0, at = 0;
                list.forEach(function (ev) {
                    var b = Defs.bytes(ev.text) + 1;
                    if (bytes > 0 && bytes + b > 16000 && at < Defs.SLOTS.length - 1) { at++; bytes = 0; }
                    ev.slot = Defs.SLOTS[at];
                    bytes += b;
                });
                setEvents(list);
                state.open = {};
                state.offList = {};
            } else if (act === "up" || act === "down") {
                moveEvent(list, g, act === "up" ? -1 : 1);
            } else if (act === "dup") {
                var copyText = Text.fields(list[g].text);
                var oldId = getField(copyText, "id") || "event";
                setField(copyText, "id", freeId(oldId.toLowerCase().replace(/[^a-z0-9_]/g, "") || "event", list));
                list.splice(g + 1, 0, { slot: list[g].slot, text: Text.join(copyText) });
                setEvents(list);
                state.open = {};
                state.offList = {};
                state.open[list[g].slot + ":" + (owner.index + 1)] = true;
            } else if (act === "del") {
                list.splice(g, 1);
                setEvents(list);
                state.open = {};
                state.offList = {};
            } else if (act === "clear") {
                var k = el.getAttribute("data-k");
                editDef(owner, function (f) { setField(f, k, null); });
            } else if (act === "addafter") {
                editDef(owner, function (f) {
                    var cur = getField(f, "after");
                    var items = cur ? cur.split(",").map(function (x) { return x.trim(); }).filter(Boolean) : [];
                    if (items.indexOf(el.getAttribute("data-k")) < 0) { items.push(el.getAttribute("data-k")); }
                    setField(f, "after", items.join(","));
                });
            } else if (act === "setadd") {
                editDef(owner, function (f) { place(f, "set.", ""); });
            } else if (act === "setdel") {
                var fi = Number(el.closest("[data-set]").getAttribute("data-set"));
                editDef(owner, function (f) { f.splice(fi, 1); });
            } else if (act === "otherdel") {
                var oi = Number(el.closest("[data-other]").getAttribute("data-other"));
                editDef(owner, function (f) { f.splice(oi, 1); });
            } else if (act === "kindadd") {
                var kf = Text.fields(state.values.Kinds);
                kf.push({ name: "", value: "", eq: true });
                state.values.Kinds = Text.join(kf);
            } else if (act === "kindready") {
                var ready = MONSTER_MODS.filter(function (x) { return x.kind === el.getAttribute("data-k"); })[0];
                var kf3 = Text.fields(state.values.Kinds);
                kf3.push({ name: ready.kind, value: ready.prefixes, eq: true });
                state.values.Kinds = Text.join(kf3);
                state.notice = "Added " + ready.kind + "=" + ready.prefixes + " to Monster kinds.";
                focus = idOf("kind", kf3.length - 1, "n");
            } else if (act === "kinddel") {
                var kf2 = Text.fields(state.values.Kinds);
                kf2.splice(Number(el.closest("[data-kind]").getAttribute("data-kind")), 1);
                state.values.Kinds = Text.join(kf2);
            } else if (act === "reset") {
                if (window.confirm("Put every option back to its default? This can't be undone.")) {
                    var f = fresh();
                    state.values = f.values;
                    state.registered = "";
                    state.open = {};
                state.offList = {};
                }
            } else if (act === "presetapply") {
                applyPreset(owner, PRESETS[state.picks[keyOf(owner)]]);
            } else if (act === "exampleadd") {
                addExample(EXAMPLES[state.picks.examples]);
            } else if (act === "undo") {
                focus = undo();
            } else if (act === "import") {
                doImport();
            } else if (act === "reroll") {
                state.cal.seed = String(Math.floor(Math.random() * 1000000));
            } else if (act === "day") {
                var key = el.getAttribute("data-k");
                state.cal.selected = state.cal.selected === key ? "" : key;
            } else if (act === "stats") {
                computeStats(check());
            }
        });
        // The Undo button is gone, so the focus goes back to the button that made the change.
        if (focus !== null && document.getElementById(focus)) { document.getElementById(focus).focus(); }
    }

    function moveEvent(list, g, dir) {
        var ev = list[g];
        var slotIndex = Defs.SLOTS.indexOf(ev.slot);
        var neighbour = list[g + dir];
        if (neighbour && neighbour.slot === ev.slot) {
            list[g] = neighbour;
            list[g + dir] = ev;
        } else if (slotIndex + dir >= 0 && slotIndex + dir < Defs.SLOTS.length) {
            ev.slot = Defs.SLOTS[slotIndex + dir];
        }
        setEvents(list);
        var after = eventList();
        var at = after.findIndex(function (x, i) { return dir < 0 ? i <= g && x.text === ev.text && x.slot === ev.slot : i >= g && x.text === ev.text && x.slot === ev.slot; });
        state.open = {};
        if (at >= 0) { state.open[after[at].slot + ":" + after[at].index] = true; }
    }

    function copy(target, button) {
        var text = target.value !== undefined && target.tagName !== "PRE" ? target.value : target.textContent;
        function done(ok) {
            button.textContent = ok ? "Copied" : "Select and copy it by hand";
            window.setTimeout(function () { button.textContent = "Copy"; }, 1800);
        }
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
        } else {
            done(fallbackCopy(text));
        }
    }

    function fallbackCopy(text) {
        var t = document.createElement("textarea");
        t.value = text;
        t.setAttribute("readonly", "");
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(t);
        return ok;
    }

    document.addEventListener("input", function (e) {
        var t = e.target;
        if (t.type === "checkbox" || t.type === "radio" || t.tagName === "SELECT") { return; }
        onInput(e);
    });
    document.addEventListener("change", function (e) {
        var t = e.target;
        if (t.type === "checkbox" || t.type === "radio" || t.tagName === "SELECT") { onInput(e); }
    });
    document.addEventListener("click", onClick);
    document.addEventListener("toggle", function (e) {
        var d = e.target;
        if (d.tagName !== "DETAILS" || !d.hasAttribute("data-ev")) { return; }
        var key = d.getAttribute("data-ev");
        if ((state.open[key] === true) !== d.open) {
            update(function () { state.open[key] = d.open; });
        }
    }, true);
    document.addEventListener("keydown", function (e) {
        var t = e.target;
        if (t.getAttribute && t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Home" || e.key === "End")) {
            var i = TABS.findIndex(function (x) { return x[0] === state.tab; });
            i = e.key === "Home" ? 0 : e.key === "End" ? TABS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length;
            e.preventDefault();
            update(function () { state.tab = TABS[i][0]; });
            document.getElementById("tab-" + TABS[i][0]).focus();
        }
    });

    render();
})();
</script>
</body>
</html>
