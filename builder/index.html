<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Crepuscular builder</title>
<link rel="icon" href="data:,">
<style>
:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --fg: #1c2230;
    --muted: #586071;
    --border: #d3d8e0;
    --field: #ffffff;
    --accent: #3f43a8;
    --accent-fg: #ffffff;
    --error: #a8231b;
    --error-bg: #fdebea;
    --warn: #7a4f00;
    --warn-bg: #fff3d4;
    --ok: #1d6b3a;
    --day: #fff8e6;
    --night: #e9ecf8;
    --focus: #1a5fd0;
    --chip-border: rgba(0, 0, 0, 0.25);
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #111318;
        --card: #1a1d24;
        --fg: #e5e7ec;
        --muted: #a4abb8;
        --border: #363c49;
        --field: #12151b;
        --accent: #a7abff;
        --accent-fg: #14152e;
        --error: #ff9b93;
        --error-bg: #3b1c1a;
        --warn: #ffd27a;
        --warn-bg: #352b12;
        --ok: #8fd9a8;
        --day: #2a2617;
        --night: #1c2236;
        --focus: #8ab4ff;
        --chip-border: rgba(255, 255, 255, 0.3);
        color-scheme: dark;
    }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
    overflow-wrap: anywhere;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
header { padding: 20px 0 8px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.2rem; margin: 0 0 8px; }
h3 { font-size: 1.05rem; margin: 16px 0 6px; }
p { margin: 6px 0; }
.muted, .help { color: var(--muted); }
.help { font-size: 0.9rem; margin: 2px 0 0; }
a { color: var(--accent); }
code, textarea, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.9rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

[role="tablist"] {
    display: flex; flex-wrap: wrap; gap: 4px;
    border-bottom: 1px solid var(--border); margin: 8px 0 16px;
    position: sticky; top: 0; background: var(--bg); z-index: 2; padding-top: 4px;
}
[role="tab"] {
    border: 1px solid transparent; border-bottom: none; background: none; color: var(--fg);
    padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 6px 6px 0 0; margin-bottom: -1px;
}
[role="tab"][aria-selected="true"] { background: var(--card); border-color: var(--border); font-weight: 600; }
.badge {
    display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; font-size: 0.8rem;
    text-align: center; line-height: 1.5; vertical-align: 1px; margin-left: 4px;
}
.badge.error { background: var(--error-bg); color: var(--error); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }

.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin: 0 0 16px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; margin-top: 8px; }
.row > * { min-width: 0; }
label, .label { display: block; font-weight: 600; font-size: 0.95rem; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
    font: inherit; color: var(--fg); background: var(--field);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; max-width: 100%;
}
textarea { width: 100%; min-height: 4.5em; resize: vertical; line-height: 1.35; }
textarea.big { min-height: 7em; }
input.small { width: 6.5em; }
input.tiny { width: 4.5em; }
input.wide, select.wide { width: 100%; }
button {
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 12px 0 0; padding: 8px 12px 12px; min-width: 0; }
legend { font-weight: 700; padding: 0 4px; }
.field { margin: 10px 0 0; }
.field:first-of-type { margin-top: 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 0; padding: 0; border: none; }
.checks label, .inline { display: inline-flex; align-items: center; gap: 4px; font-weight: 400; }
.choice { display: flex; flex-wrap: wrap; gap: 4px 14px; }

.msg { margin: 4px 0 0; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem; }
.msg.error { background: var(--error-bg); color: var(--error); }
.msg.warn { background: var(--warn-bg); color: var(--warn); }
.msg.info { background: var(--night); color: var(--fg); }
ul.msgs { list-style: none; padding: 0; margin: 4px 0; }

.meter { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin: 4px 0; }
.meter .bar { flex: 1 1 80px; max-width: 220px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--ok); }
.meter.amber .fill { background: #d99a00; }
.meter.red .fill { background: var(--error); }
.meter.amber .num { color: var(--warn); }
.meter.red .num { color: var(--error); font-weight: 700; }

details.event { border: 1px solid var(--border); border-radius: 6px; margin: 8px 0; background: var(--card); }
details.event > summary {
    padding: 8px 10px; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
details.event > .body { padding: 0 12px 12px; border-top: 1px solid var(--border); }
details.tip > summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
details.tip p { font-size: 0.9rem; color: var(--muted); }
.chip {
    display: inline-block; max-width: 100%; padding: 0 6px; border-radius: 4px; border: 1px solid var(--chip-border);
    font-size: 0.85rem; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.swatch { display: inline-block; width: 0.9em; height: 0.9em; border-radius: 3px; border: 1px solid var(--chip-border); vertical-align: -1px; }
.setrow { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) auto; gap: 6px; margin: 6px 0 0; align-items: center; }
.setrow input { width: 100%; }
.kindrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 6px; margin: 6px 0 0; align-items: center; }
.kindrow input { width: 100%; }
pre.out { white-space: pre-wrap; word-break: break-all; background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 6px 0; max-height: 26em; overflow: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 8px 0; font-size: 0.9rem; }
.month { margin: 18px 0; }
.month h3 { margin: 0 0 6px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow { font-size: 0.75rem; color: var(--muted); text-align: center; }
.cell {
    display: block; width: 100%; min-height: 4.2em; padding: 2px 3px 3px; text-align: left; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card); font-size: 0.75rem; line-height: 1.25; overflow: hidden;
}
.cell[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 0; }
.cell { overflow-wrap: normal; }
.cell .top { display: flex; justify-content: space-between; gap: 2px; white-space: nowrap; overflow: hidden; }
.cell .date { font-weight: 700; }
.cell .moonname { color: var(--muted); font-size: 0.7rem; }
.cell .moonname.first { color: var(--fg); font-weight: 700; }
.occ { display: block; margin-top: 2px; padding: 0 2px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.occ.day { background: var(--day); }
.occ.night { background: var(--night); }
.occ .chip { font-size: 0.7rem; padding: 0 3px; }
.occ .cont { opacity: 0.8; font-style: italic; }
.blank { visibility: hidden; }
.detail { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 8px 0 0; background: var(--card); }
.detail h4 { margin: 10px 0 4px; font-size: 1rem; }
.log { font-size: 0.85rem; margin: 4px 0; padding-left: 1.2em; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.scroll { overflow-x: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) {
    .cell { min-height: 3.6em; font-size: 0.68rem; padding: 1px 2px 2px; }
    .occ .chip { font-size: 0.64rem; padding: 0 2px; }
    .cell .moonname { font-size: 0.58rem; }
    .setrow, .kindrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .setrow button, .kindrow button { grid-column: span 2; justify-self: start; }
    [role="tab"] { padding: 8px 10px; }
}
</style>
</head>

<script>
(function () {
    "use strict";
    var C = window.Crepuscular;
    var Defs = C.Defs, Text = C.Text;
    var STORE = "crepuscular-builder";

    // ---------------------------------------------------------------- in-game texts (EN translations)
    var EVENTS_MORE = "More events, written as in Events 1. The option an event is in only matters between events with the same prio: earlier ones are tried first.";
    var TEXT = {
        NightMode: { name: "Night mode", options: ["Fixed hours", "Seasonal night"], tooltip: "How night is decided. Fixed hours: night runs between the two hours below, every day of the year, whatever the Day/Night Cycle setting. Seasonal night: the game's own dusk and dawn, which move with the seasons and follow the Day/Night Cycle setting (endless day has no night, endless night is always night)." },
        NightStartHour: { name: "Night starts at", tooltip: "Hour of the day, 0 to 23, at which night begins when Night mode is Fixed hours. Night can run past midnight. If both hours are the same there is no night at all, and the log says so." },
        NightEndHour: { name: "Night ends at", tooltip: "Hour of the day, 0 to 23, at which night ends when Night mode is Fixed hours." },
        Day: { name: "Day", tooltip: "What changes by day while no event runs. Fields are key=value, separated by ;. speed=+25 makes 25 percent of ordinary zombies one tier faster (shambler to fast shambler, fast shambler to sprinter) and speed=-50 makes 50 percent one tier slower; a zombie that speeds up is among the last to slow down, and speed=0 keeps every zombie at the game's speed. steps=2 moves them two tiers: always sprinters or always shamblers. health=0.7 gives new and reloaded zombies 70 percent of the health they roll and lowers any zombie above 70 percent of the most a new one can have; health=1.5 gives new and reloaded zombies 150 percent, and zombies already around keep theirs. Both can grow with the days since the world began: speed=+25..+75;grow=60d goes from +25 on world day 0 to +75 on world day 60 and stays there, grow=30d..90d moves it between those days instead, and health=0.7..0.4 works the same way. World days are counted at noon, as for every= and mindays=, and a speed share is rounded to a whole percent. A range needs grow= in the same definition, and grow= moves only that definition's own ranges. Monsters of every kind, Bandits and crawlers keep their own speed and are never capped; the health factor is given as the game creates a zombie, before it marks some of them, so a reloaded crawler or a new mutant may get it too. off=cof,mutants turns those monster kinds off (off=none turns none off): far ones are removed, The Mutants makes no new mutants and Cry of Fear Monster NPCs spawns nothing new. A kind no definition turns off is left alone. For Cry of Fear monsters only at night, write off=cof here and keep its own Night only option off; as with that option, each time cof is on again every Cry of Fear home may be filled again, so killed monsters come back too. set.Table.Option=value changes a sandbox option, for example set.ZombieLore.Toughness=1, or set.Option=value for an option without a table, for example set.HoursForCorpseRemoval=24; it goes back to its base value when the day ends. say=text shows a line to every player when the day begins (say=@Key shows that translation), and color=rrggbb gives its colour. sound=Name plays that game sound on every player's game at the same moment, with or without a line, for example sound=MetaWolfHowl; upper and lower case matter. A sun event starts from these values. The default, speed=+25;health=0.7, makes a quarter of the zombies faster and the zombies more fragile. A bad field is skipped and logged, and the rest applies." },
        Night: { name: "Night", tooltip: "What changes by night while no event runs, written as for Day: speed=-50 or speed=+25, steps=2, health=1.5, a range that grows such as speed=-25..-75;grow=60d, off=mutants,cof or off=none, set.Table.Option=value, say=text, color=rrggbb and sound=Name. The values go back to their base when the night ends. A moon event starts from these values, even when it runs into the day. The default, speed=-50;off=mutants, makes half of the zombies slower, keeps The Mutants from making mutants at night and removes far mutants." },
        Events1: { name: "Events 1", tooltip: "Moons and suns: special nights and days. Events are separated by |, fields by ;. Each event needs id=name (letters a-z, digits and _) and track=moon (decided when night begins) or track=sun (decided when day begins). Conditions, which must all hold: moon=full (the first night of a full moon; also new, waxingcrescent, firstquarter, waxinggibbous, waninggibbous, thirdquarter, waningcrescent), date=10-31 or date=12-20..01-05, month=6..8, season=summer, every=30 (every 30 days since the world began; every=30+5 shifts it by 5), mindays=30 and maxdays=365 (days since the world began), nth=4 (every 4th time its calendar conditions hold), after=id (the first time after that event ended), cooldown=20d or 36h, interval=3d..7d (after each start it waits a random 3 to 7 whole days, counted in world days, before it can happen again, and the first wait counts from the world's start; interval=7d waits exactly 7 days, interval=12h..36h whole hours from its start time; once the wait is over it stays a candidate until it starts, so a lost chance or a higher prio doesn't roll a new wait, and an admin start counts as a start), weather=rain, snow, storm, fog or clear, tempmin=0 and tempmax=30 (degrees C), chance=50. A list such as moon=full,new holds when any item does. Timing: at=HH:MM starts it later in its night or day, and for=phase (the default), 2p (phases), 6h or 3.5d sets how long it lasts. prio=10: when several events qualify, the highest is tried first. Effects: speed, steps, health, off, set., say, color and sound, as in Day and Night, with grow= for its own ranges; a moon starts from Night and a sun from Day, and a range it takes from them grows with their grow=. One event runs at a time, and nothing else is decided while it runs. An event with an error is skipped and logged. Keep each option under 32000 bytes." },
        Kinds: { name: "Monster kinds", tooltip: "Monsters of other mods, told by their outfit: name=prefix,prefix;name=prefix, for example wraiths=ZW_,Wraith;husks=Husk_. A zombie whose outfit name starts with one of the prefixes (upper and lower case don't matter) belongs to that kind. Names are made of a-z, 0-9 and _. cof (Cry of Fear Monster NPCs) and mutants (The Mutants) are built in, and other mods can add kinds of their own. Put a kind in off= of Day, Night or an event to remove its far members while that applies; it can't keep a mod from turning zombies into its monsters. When The Mutants is loaded, members of every kind are never turned into mutants." },
    };
    Defs.SLOTS.slice(1).forEach(function (slot) {
        TEXT[slot] = { name: "Events " + slot.slice(6), tooltip: EVENTS_MORE };
    });
    var SAY_KEYS = { "@IGUI_Crepuscular_BloodMoon": "The moon rises red. A blood moon has begun." };

    var MOONS = ["new", "waxingcrescent", "firstquarter", "waxinggibbous", "full", "waninggibbous", "thirdquarter", "waningcrescent"];
    var MOON_LABELS = ["new", "waxing crescent", "first quarter", "waxing gibbous", "full", "waning gibbous", "third quarter", "waning crescent"];
    var SEASON_NAMES = ["spring", "summer", "autumn", "winter"];
    var SEASON_NUMBERS = { spring: [1], summer: [2, 3], autumn: [4], winter: [5] };
    var WEATHERS = ["rain", "snow", "storm", "fog", "clear"];
    var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var COF_LEVELS = ["None", "Rare", "Uncommon", "Normal", "High"];
    var COF_MONSTERS = Object.keys(C.COF_OPTIONS).filter(function (k) { return C.COF_OPTIONS[k].type === "enum"; }).map(function (k) { return k.slice(11); });
    var BUILTIN_KINDS = ["cof", "mutants"];

    // Where a new field goes, so written text reads like the mod's own examples.
    var KEY_ORDER = ["id", "track", "moon", "date", "month", "season", "every", "nth", "mindays", "maxdays", "after",
        "cooldown", "interval", "weather", "tempmin", "tempmax", "chance", "at", "for", "prio", "speed", "steps", "health", "grow", "off", "set.",
        "say", "color", "sound"];
    var EVENT_KEYS = KEY_ORDER.filter(function (k) { return k !== "set."; });
    var BASE_KEYS = ["speed", "steps", "health", "grow", "off", "say", "color", "sound"];
    var GROWING = ["speed", "health"];

    // Sounds the game itself plays by name, all of them once rather than in a loop.
    var SOUNDS = [
        ["Thunder", "a thunder clap"], ["RumbleThunder", "far thunder rolling"], ["MetaWolfHowl", "a wolf howling far away"],
        ["MetaOwl", "an owl"], ["MetaScream", "a scream far away"], ["MetaDogBark", "a dog barking far away"],
        ["WorldEventElectricityShutdown", "the power grid shutting down"],
    ];

    var HELP = {
        id: "Required. Letters a-z, digits and _, unique across all Events options. Counters and chains are kept by id.",
        track: "Required. moon: decided when night begins. sun: decided when day begins.",
        at: "HH or HH:MM: starts it later in its night or day. With fixed hours it must fall inside the night (moon) or the day (sun).",
        "for": "How long it lasts: its phase (the default), a number of phases (2 = this one and the next, up to 60), hours or days (3.5 days = 84 hours), up to 30 days in all.",
        prio: "When several events qualify, the highest is tried first; between equal ones the earlier. Whole number, -999 to 999; 0 if empty.",
        moon: "The first night (or day) of that moon phase, as the game computes it for the date. Several boxes: any of them.",
        date: "MM-DD or MM-DD..MM-DD, which may wrap the year end, separated by commas: 10-31, 12-20..01-05.",
        month: "The month of the night's or day's date. Ranges like November to February wrap.",
        season: "The game's season at the decision. The calendar here only approximates it (≈).",
        every: "Every N days since the world began (N 2 to 3650); a shift K below N moves it: N=30, K=5 is days 5, 35, 65 …",
        nth: "Every Nth time its other calendar conditions hold (N 1 to 1000), even when another event won or one was running; K (1 to N) is the first hit: N=4, K=1 fires on the 1st, 5th, 9th …",
        mindays: "Days since the world began, 0 to 36500, counted at noon of the night's or day's date.",
        maxdays: "Days since the world began, 0 to 36500, at most.",
        after: "Event ids, separated by commas: the first night or day of this track decided after one of them ended. It still has to win, so give it the highest prio.",
        cooldown: "At least this long since its last start, up to 3650 days.",
        interval: "After each start it waits a random whole number of days (or hours) between the two, before it can happen again; the first wait counts from the world's start. Days count world days, like every and the world-day fields; hours count from its start time. Leave the longest empty for a fixed wait. Once the wait is over it stays a candidate until it starts: a lost chance or a higher prio doesn't roll a new wait, and an admin start counts as a start.",
        weather: "At the decision: rain, snow, storm, fog (intensity 0.5 or more) or clear (none of these). Several: any.",
        tempmin: "Temperature at the decision, °C, -80 to 80: at least this.",
        tempmax: "Temperature at the decision, °C, -80 to 80: at most this.",
        chance: "Percent, 0 to 100, decimals allowed. Rolled only when it is the highest candidate left; empty means always.",
        speed: "A share of the ordinary zombies, in percent, moves a tier faster or slower (shambler, fast shambler, sprinter). The same zombies are picked every time, on the server and on every player's game, and the ones that speed up are the last to slow down. 0 keeps every zombie at the game's speed. A range goes from its first share to its second over the days of Grows, rounded to whole percents.",
        steps: "How many tiers they move: 2 makes them always sprinters (faster) or always shamblers (slower).",
        health: "0.1 to 5. Below 1, new and reloaded zombies get that share of the health they roll, and no zombie keeps more than that share of the most a new one can have. Above 1, new and reloaded zombies get that much more; zombies already around keep theirs. 1 changes nothing. A range such as 0.7..0.4 goes from the first to the second over the days of Grows.",
        grow: "The world days over which this definition's ranges (speed or health a..b) go from their first value to their second; before and after, they keep their ends. Empty from means world day 0. World days are counted at noon, as for every. Only this definition's own ranges grow: an event that takes a range from Day or Night follows their Grows.",

        color: "The colour of that line; white when not set.",
        sound: "A game sound played on every player's game when it starts, with or without a line; upper and lower case matter. The suggestions are sounds of the game itself; another mod's sound works by its name.",
    };

    // ---------------------------------------------------------------- state
    function fresh() {
        var values = {};
        C.OPTION_ORDER.forEach(function (name) { values[name] = C.DEFAULTS[name]; });
        return {
            values: values,
            registered: "",
            tab: "defs",
            open: {},
            showAll: false,
            cal: {
                start: "1993-07-09", time: "09:00", dawn: "06:00", dusk: "21:00", cycle: "normal",
                from: "", months: "6", seed: "1", view: "outcome", worldDay: "30",
                rain: "25", snow: "25", storm: "25", fog: "25", winter: "0", summer: "25", selected: "",
            },
            importText: "", importAs: "detect", importTarget: "Events1", importReset: true, importReport: null,
            stats: null, notice: null,
            // Definitions whose off= is set to "these kinds" before any kind is ticked.
            offList: {},
        };
    }

    function load() {
        var s = fresh();
        try {
            var saved = JSON.parse(window.localStorage.getItem(STORE) || "null");
            if (saved && typeof saved === "object") {
                C.OPTION_ORDER.forEach(function (name) {
                    var v = saved.values ? saved.values[name] : undefined;
                    var ok = typeof C.DEFAULTS[name] === "string" ? typeof v === "string"
                        : v === Math.floor(v) && v >= (name === "NightMode" ? 1 : 0) && v <= (name === "NightMode" ? 2 : 23);
                    if (ok) { s.values[name] = v; }
                });
                if (typeof saved.registered === "string") { s.registered = saved.registered; }
                if (["defs", "cal", "import", "export"].indexOf(saved.tab) >= 0) { s.tab = saved.tab; }

    }

            } else if (act === "day") {
                var key = el.getAttribute("data-k");
                state.cal.selected = state.cal.selected === key ? "" : key;
            } else if (act === "stats") {
                computeStats(check());
            }
        });
    }

    function moveEvent(list, g, dir) {
        var ev = list[g];
        var slotIndex = Defs.SLOTS.indexOf(ev.slot);
        var neighbour = list[g + dir];
        if (neighbour && neighbour.slot === ev.slot) {
            list[g] = neighbour;
            list[g + dir] = ev;
        } else if (slotIndex + dir >= 0 && slotIndex + dir < Defs.SLOTS.length) {
            ev.slot = Defs.SLOTS[slotIndex + dir];
        }
        setEvents(list);
        var after = eventList();
        var at = after.findIndex(function (x, i) { return dir < 0 ? i <= g && x.text === ev.text && x.slot === ev.slot : i >= g && x.text === ev.text && x.slot === ev.slot; });
        state.open = {};
        if (at >= 0) { state.open[after[at].slot + ":" + after[at].index] = true; }
    }

    function copy(target, button) {
        var text = target.value !== undefined && target.tagName !== "PRE" ? target.value : target.textContent;
        function done(ok) {
            button.textContent = ok ? "Copied" : "Select and copy it by hand";
            window.setTimeout(function () { button.textContent = "Copy"; }, 1800);
        }
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
        } else {
            done(fallbackCopy(text));
        }
    }

    function fallbackCopy(text) {
        var t = document.createElement("textarea");
        t.value = text;
        t.setAttribute("readonly", "");
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(t);
        return ok;
    }

    document.addEventListener("input", function (e) {
        var t = e.target;
        if (t.type === "checkbox" || t.type === "radio" || t.tagName === "SELECT") { return; }
        onInput(e);
    });
    document.addEventListener("change", function (e) {
        var t = e.target;
        if (t.type === "checkbox" || t.type === "radio" || t.tagName === "SELECT") { onInput(e); }
    });
    document.addEventListener("click", onClick);
    document.addEventListener("toggle", function (e) {
        var d = e.target;
        if (d.tagName !== "DETAILS" || !d.hasAttribute("data-ev")) { return; }
        var key = d.getAttribute("data-ev");
        if ((state.open[key] === true) !== d.open) {
            update(function () { state.open[key] = d.open; });
        }
    }, true);
    document.addEventListener("keydown", function (e) {
        var t = e.target;
        if (t.getAttribute && t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Home" || e.key === "End")) {
            var i = TABS.findIndex(function (x) { return x[0] === state.tab; });
            i = e.key === "Home" ? 0 : e.key === "End" ? TABS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length;
            e.preventDefault();
            update(function () { state.tab = TABS[i][0]; });
            document.getElementById("tab-" + TABS[i][0]).focus();
        }
    });

    render();
})();
</script>
</body>
</html>
