name: Workshop

# Uploads the Steam Workshop item named by workshop.txt's id=: Contents/, preview.png, and the title,
# description and visibility in workshop.txt, so the Steam page follows the repo. The item's first upload,
# which also sets its tags, is done from the game.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      note:
        description: Change note on the Workshop page
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: workshop

env:
  # Project Zomboid
  APP_ID: '108600'
  # steamcmd/steamcmd:ubuntu-22
  STEAMCMD: steamcmd/steamcmd@sha256:d01556886b9b48a85ea68bfe34197a67e710b74aa61b28aec43ab97f2eee4249

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: steam
    steps:
      - uses: actions/checkout@v7

      - name: Item manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTE: ${{ github.event_name == 'release' && github.event.release.body || inputs.note }}
        run: |
          field() { sed -n "s/^$1=//p" workshop.txt | tr -d '\r'; }
          fail() { echo "::error::$1"; exit 1; }
          id=$(field id)
          [ -n "$id" ] || fail "workshop.txt has no id=: upload the item once from the game and commit the id it writes"
          version=$(sed -n 's/^modversion=//p' Contents/mods/*/42/mod.info | tr -d '\r')
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            fail "the release tag $TAG is not v$version, the modversion in mod.info"
          fi
          # The same numbers as the game's uploader.
          case $(field visibility) in
            public) visibility=0 ;;
            friendsOnly) visibility=1 ;;
            private) visibility=2 ;;
            unlisted) visibility=3 ;;
            *) fail "workshop.txt visibility= is not public, friendsOnly, private or unlisted" ;;
          esac
          title=$(field title)
          description=$(field description)
          # They go into quoted VDF strings.
          if printf '%s%s' "$title" "$description" | grep -q '"'; then
            fail "workshop.txt's title and description can't hold a double quote"
          fi
          [ "$(printf '%s' "$description" | wc -c)" -le 8000 ] || fail "workshop.txt's description is over Steam's 8000 bytes"
          note=$(printf '%s' "${NOTE:-$version}" | tr -d '\r' | tr '"' "'")
          cat > "$RUNNER_TEMP/item.vdf" <<VDF
          "workshopitem"
          {
            "appid" "$APP_ID"
            "publishedfileid" "$id"
            "contentfolder" "/item/Contents"
            "previewfile" "/item/preview.png"
            "visibility" "$visibility"
            "title" "$title"
            "description" "$description"
            "changenote" "$note"
          }
          VDF

      - name: Upload
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          # steamcmd keeps its login under $HOME/Steam; the secret is that config.vdf after a login with Steam Guard.
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/Steam/config"
          printf '%s\n' "$STEAM_CONFIG_VDF" > "$home/Steam/config/config.vdf"
          docker run --rm -e HOME=/home/ci -v "$home:/home/ci" -v "$GITHUB_WORKSPACE:/item:ro" \
            -v "$RUNNER_TEMP/item.vdf:/item.vdf:ro" "$STEAMCMD" \
            +login "$STEAM_USERNAME" +workshop_build_item /item.vdf +quit || {
            cat "$home"/Steam/logs/*.txt 2>/dev/null || true
            exit 1
          }
